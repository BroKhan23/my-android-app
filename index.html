<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Cosmic Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020208;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* UI Overlay */
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .score-box {
            background: rgba(18, 18, 30, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 16px;
            color: #fff;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 1px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .score-box span {
            color: #00ffcc;
        }
        /* Touch Screen Controls */
        #touch-controls {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            pointer-events: auto;
        }
        .touch-zone {
            flex: 1;
            height: 100%;
        }
        /* Game Over Modal */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 4, 12, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #game-over-screen.active {
            opacity: 1;
            pointer-events: auto;
        }
        .game-title {
            color: #ff3366;
            font-size: 38px;
            font-weight: 900;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 51, 102, 0.6);
        }
        .final-score {
            color: #fff;
            font-size: 20px;
            margin-bottom: 28px;
        }
        .restart-btn {
            background: linear-gradient(135deg, #00ffcc, #0099ff);
            border: none;
            color: #000;
            font-weight: 800;
            padding: 14px 40px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.5);
            transition: transform 0.1s ease;
        }
        .restart-btn:active {
            transform: scale(0.95);
        }
        .instructions {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            letter-spacing: 0.5px;
        }
    </style>
    <!-- Three.js 3D Library CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Mobile Touch Area -->
    <div id="touch-controls">
        <div class="touch-zone" id="left-zone"></div>
        <div class="touch-zone" id="right-zone"></div>
    </div>

    <!-- UI Layer -->
    <div id="ui">
        <div class="hud">
            <div class="score-box">SCORE: <span id="score-text">0</span></div>
            <div class="score-box">SPEED: <span id="speed-text">1.0x</span></div>
        </div>
        <div class="instructions" id="hint">স্ক্রিনের ডানে ও বাঁয়ে ট্যাপ বা চেপে ধরে জাহাজ চালান</div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen">
        <div class="game-title">CRASHED!</div>
        <div class="final-score">Your Score: <span id="final-score-val" style="color: #00ffcc; font-weight: bold;">0</span></div>
        <button class="restart-btn" id="restart-btn">PLAY AGAIN</button>
    </div>

    <script>
        // --- 3D Scene Initialization ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020208, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 7);
        camera.lookAt(0, 0, -5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- Lights ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x00ffff, 1.2);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // --- Space Tunnel / Grid Floor ---
        const gridHelper = new THREE.GridHelper(300, 60, 0x00ffcc, 0x1f1f3a);
        gridHelper.position.set(0, -1, -50);
        scene.add(gridHelper);

        // --- Starfield Background ---
        const starGeo = new THREE.BufferGeometry();
        const starCount = 800;
        const starPositions = new Float32Array(starCount * 3);
        for(let i = 0; i < starCount * 3; i += 3) {
            starPositions[i] = (Math.random() - 0.5) * 200;
            starPositions[i+1] = (Math.random() - 0.5) * 100 + 10;
            starPositions[i+2] = (Math.random() - 0.5) * 300 - 50;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.6, transparent: true, opacity: 0.8 });
        const starField = new THREE.Points(starGeo, starMat);
        scene.add(starField);

        // --- 3D Player Spaceship ---
        const playerGroup = new THREE.Group();

        // Hull
        const bodyGeo = new THREE.ConeGeometry(0.7, 2.2, 5);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00d2ff, roughness: 0.3, metalness: 0.8 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.rotation.x = Math.PI / 2;
        playerGroup.add(body);

        // Wings
        const wingGeo = new THREE.BoxGeometry(2.4, 0.08, 0.8);
        const wingMat = new THREE.MeshStandardMaterial({ color: 0xff007f, roughness: 0.4 });
        const wings = new THREE.Mesh(wingGeo, wingMat);
        wings.position.set(0, 0, 0.4);
        playerGroup.add(wings);

        // Engine Glow
        const engineGeo = new THREE.SphereGeometry(0.25, 12, 12);
        const engineMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const engine = new THREE.Mesh(engineGeo, engineMat);
        engine.position.set(0, 0, 1.1);
        playerGroup.add(engine);

        playerGroup.position.set(0, 0, 0);
        scene.add(playerGroup);

        // --- Game State Variables ---
        let isGameOver = false;
        let score = 0;
        let speed = 0.6;
        let targetX = 0;
        const maxX = 5.5;

        // Obstacles Array
        const obstacles = [];
        const obstacleGeo = new THREE.DodecahedronGeometry(0.9, 0);
        const obstacleMat = new THREE.MeshStandardMaterial({ color: 0xff3355, roughness: 0.5, metalness: 0.3 });

        function spawnObstacle(zPos) {
            const obs = new THREE.Mesh(obstacleGeo, obstacleMat);
            obs.position.x = (Math.random() - 0.5) * (maxX * 2);
            obs.position.y = 0;
            obs.position.z = zPos;
            obs.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
            scene.add(obs);
            obstacles.push(obs);
        }

        // Pre-populate obstacles ahead
        for (let i = 0; i < 15; i++) {
            spawnObstacle(-25 - (i * 20));
        }

        // --- Controls Handling (Touch & Keyboard) ---
        let moveLeft = false;
        let moveRight = false;

        const leftZone = document.getElementById('left-zone');
        const rightZone = document.getElementById('right-zone');

        leftZone.addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft = true; });
        leftZone.addEventListener('touchend', (e) => { e.preventDefault(); moveLeft = false; });
        rightZone.addEventListener('touchstart', (e) => { e.preventDefault(); moveRight = true; });
        rightZone.addEventListener('touchend', (e) => { e.preventDefault(); moveRight = false; });

        // Keyboard support for testing
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = true;
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = false;
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight = false;
        });

        // Resize Event
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // UI Elements
        const scoreText = document.getElementById('score-text');
        const speedText = document.getElementById('speed-text');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreVal = document.getElementById('final-score-val');
        const restartBtn = document.getElementById('restart-btn');

        restartBtn.addEventListener('click', resetGame);

        function resetGame() {
            isGameOver = false;
            score = 0;
            speed = 0.6;
            targetX = 0;
            playerGroup.position.x = 0;
            playerGroup.rotation.z = 0;

            obstacles.forEach(obs => scene.remove(obs));
            obstacles.length = 0;

            for (let i = 0; i < 15; i++) {
                spawnObstacle(-25 - (i * 20));
            }

            gameOverScreen.classList.remove('active');
        }

        function triggerGameOver() {
            isGameOver = true;
            finalScoreVal.innerText = Math.floor(score);
            gameOverScreen.classList.add('active');
        }

        // --- Game Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            if (!isGameOver) {
                // Movement Logic
                if (moveLeft) targetX -= 0.22;
                if (moveRight) targetX += 0.22;
                targetX = Math.max(-maxX, Math.min(maxX, targetX));

                // Smooth Ship Lerp
                playerGroup.position.x += (targetX - playerGroup.position.x) * 0.15;
                playerGroup.rotation.z = -(targetX - playerGroup.position.x) * 1.5;

                // Move grid floor
                gridHelper.position.z += speed;
                if (gridHelper.position.z > 0) gridHelper.position.z = -50;

                // Move Obstacles
                for (let i = 0; i < obstacles.length; i++) {
                    const obs = obstacles[i];
                    obs.position.z += speed;
                    obs.rotation.x += 0.02;
                    obs.rotation.y += 0.03;

                    // Collision Detection (Sphere Distance)
                    const dist = playerGroup.position.distanceTo(obs.position);
                    if (dist < 1.3) {
                        triggerGameOver();
                    }

                    // Recycle Obstacle when passed
                    if (obs.position.z > 10) {
                        obs.position.z = -280;
                        obs.position.x = (Math.random() - 0.5) * (maxX * 2);
                    }
                }

                // Increase Score and Speed
                score += speed * 0.4;
                speed = Math.min(1.4, 0.6 + score * 0.001);

                scoreText.innerText = Math.floor(score);
                speedText.innerText = speed.toFixed(1) + 'x';
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
