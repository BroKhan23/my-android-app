        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            font-family: 'Outfit', sans-serif;

        .font-mono-math {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
        }
        /* Glassmorphism surfaces */
        .glass-panel {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.18);
        }
        /* Animated ambient glow */
        @keyframes floatGlow {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(30px, -40px) scale(1.15); }
        }
        .animate-glow-1 {
            animation: floatGlow 14s ease-in-out infinite alternate;
        }
        .animate-glow-2 {
            animation: floatGlow 18s ease-in-out infinite alternate-reverse;
        }
        /* Keypad press ripple */
        .btn-ripple {
            position: relative;
            overflow: hidden;
        }
        .btn-ripple::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 10%, transparent 10.01%);
            background-repeat: no-repeat;
            background-position: 50%;
            transform: scale(10, 10);
            opacity: 0;
            transition: transform .3s, opacity .5s;
        }
        .btn-ripple:active::after {
            transform: scale(0, 0);
            opacity: .4;
            transition: 0s;
        }
    </style>
</head>

    <script>
        /* State Variables */
        let currentExpression = '';
        let evaluatedResult = '0';
        let isAngleDegree = true;
        let isSoundEnabled = true;
        let isSciPadOpen = false;
        let calculationHistory = [];
        let currentThemeIndex = 0;

        /* Themes Preset Palette */
        const themes = [
            {
                name: 'Cosmic Violet',
                glow1: 'bg-purple-600/25',
                glow2: 'bg-cyan-600/25',
                btnEqual: 'bg-gradient-to-r from-purple-500 to-pink-500',
                accentText: 'text-purple-400'
            },
            {
                name: 'Emerald Neon',
                glow1: 'bg-emerald-600/25',
                glow2: 'bg-teal-600/25',
                btnEqual: 'bg-gradient-to-r from-emerald-500 to-teal-400',
                accentText: 'text-emerald-400'
            },
            {
                name: 'Cyberpunk Gold',
                glow1: 'bg-amber-600/25',
                glow2: 'bg-orange-600/25',
                btnEqual: 'bg-gradient-to-r from-amber-500 to-orange-500',
                accentText: 'text-amber-400'
            },
            {
                name: 'Midnight Azure',
                glow1: 'bg-blue-600/25',
                glow2: 'bg-indigo-600/25',
                btnEqual: 'bg-gradient-to-r from-blue-500 to-indigo-500',
                accentText: 'text-blue-400'
            }
        ];

        let audioCtx = null;
        function playClickSound(freq = 600, type = 'sine') {
            if (!isSoundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 0.5, audioCtx.currentTime + 0.05);

                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.06);
            } catch (e) {
                // Audio fallback silence
            }
        }

        function toggleAudio() {
            isSoundEnabled = !isSoundEnabled;
            const icon = document.getElementById('soundIcon');
            if (isSoundEnabled) {
                icon.className = 'fa-solid fa-volume-high text-xs text-purple-400';
                showToast('সাউন্ড চালু হয়েছে');
                playClickSound(800);
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-xs text-slate-500';
                showToast('সাউন্ড বন্ধ করা হয়েছে');
            }
        }

        function updateDisplay() {
            const expDisplay = document.getElementById('expressionDisplay');
            const resDisplay = document.getElementById('mainResultDisplay');

            // Format formula readable symbols for visual display
            let friendlyExpression = currentExpression
                .replace(/\*/g, ' × ')
                .replace(/\//g, ' ÷ ')
                .replace(/\+/g, ' + ')
                .replace(/-/g, ' − ')
                .replace(/Math\.sqrt\(/g, '√(')
                .replace(/Math\.PI/g, 'π')
                .replace(/Math\.E/g, 'e')
                .replace(/\*\*/g, '^');

            expDisplay.textContent = friendlyExpression || '0';
            resDisplay.value = evaluatedResult || '0';

            // Auto-scale font size if digits get large
            const len = resDisplay.value.length;
            if (len > 12) {
                resDisplay.className = resDisplay.className.replace(/text-\S+/, 'text-2xl');
            } else if (len > 8) {
                resDisplay.className = resDisplay.className.replace(/text-\S+/, 'text-3xl');
            } else {
                resDisplay.className = resDisplay.className.replace(/text-\S+/, 'text-5xl');
            }
        }

        function pressKey(key) {
            playClickSound(550);
            // Replace leading 0 if needed
            if (currentExpression === '0' && !isNaN(key)) {
                currentExpression = key;
            } else {
                currentExpression += key;
            }
            updateDisplay();
        }

        function pressOperator(op) {
            playClickSound(700);
            if (currentExpression === '' && evaluatedResult !== '0' && evaluatedResult !== 'ত্রুটি') {
                currentExpression = evaluatedResult + op;
            } else {
                const lastChar = currentExpression.slice(-1);
                if (['+', '-', '*', '/'].includes(lastChar)) {
                    currentExpression = currentExpression.slice(0, -1) + op;
                } else {
                    currentExpression += op;
                }
            }
            updateDisplay();
        }

        function pressFunc(fnName) {
            playClickSound(850);
            // Angle mode consideration for trigs
            if (['sin', 'cos', 'tan'].includes(fnName)) {
                if (isAngleDegree) {
                    currentExpression += `Math.${fnName}((Math.PI/180)*`;
                } else {
                    currentExpression += `Math.${fnName}(`;
                }
            } else if (['asin', 'acos', 'atan'].includes(fnName)) {
                if (isAngleDegree) {
                    currentExpression += `((180/Math.PI)*Math.${fnName}(`;
                } else {
                    currentExpression += `Math.${fnName}(`;
                }
            } else {
                currentExpression += `Math.${fnName}(`;
            }
            updateDisplay();
        }

        function toggleSign() {
            playClickSound(600);
            if (currentExpression !== '') {
                if (currentExpression.startsWith('-')) {
                    currentExpression = currentExpression.substring(1);
                } else {
                    currentExpression = '-' + currentExpression;
                }
            } else if (evaluatedResult !== '0' && evaluatedResult !== 'ত্রুটি') {
                evaluatedResult = (parseFloat(evaluatedResult) * -1).toString();
            }
            updateDisplay();
        }

        function backspace() {
            playClickSound(420);
            if (currentExpression.length > 0) {
                // Check if backspacing a Math function snippet
                if (currentExpression.endsWith('Math.sqrt(')) {
                    currentExpression = currentExpression.slice(0, -10);
                } else if (currentExpression.endsWith('Math.PI') || currentExpression.endsWith('Math.E')) {
                    currentExpression = currentExpression.slice(0, -7);
                } else {
                    currentExpression = currentExpression.slice(0, -1);
                }
            }
            if (currentExpression === '') {
                evaluatedResult = '0';
            }
            updateDisplay();
        }

        function clearAll() {
            playClickSound(300, 'square');
            currentExpression = '';
            evaluatedResult = '0';
            updateDisplay();
        }

        function sanitizeAndEval(code) {
            // Check allowed mathematical tokens only
            const sanitized = code.replace(/[^0-9+\-*/().%^eE\sMathPIsincoctalglg]/g, '');
            // Auto close missing parentheses
            let openParenCount = (sanitized.match(/\(/g) || []).length;
            let closeParenCount = (sanitized.match(/\)/g) || []).length;
            let balancedCode = sanitized;
            while (openParenCount > closeParenCount) {
                balancedCode += ')';
                closeParenCount++;
            }
            // Safely evaluate math expression
            return Function(`"use strict"; return (${balancedCode})`)();
        }

        function calculateResult() {
            playClickSound(950, 'triangle');
            if (!currentExpression && evaluatedResult !== '0') return;

            try {
                let expressionToSolve = currentExpression || evaluatedResult;
                
                // Parse percentage
                expressionToSolve = expressionToSolve.replace(/(\d+(\.\d+)?)%/g, '($1/100)');

                let result = sanitizeAndEval(expressionToSolve);

                if (result === undefined || isNaN(result)) {
                    evaluatedResult = 'ত্রুটি';
                } else if (!isFinite(result)) {
                    evaluatedResult = 'অসীম (∞)';
                } else {
                    // Precision handling
                    const rounded = Math.round(result * 100000000) / 100000000;
                    evaluatedResult = rounded.toString();
                    
                    // Add to History
                    saveToHistory(currentExpression, evaluatedResult);
                }
            } catch (err) {
                evaluatedResult = 'ত্রুটি';
            }
            updateDisplay();
        }

        function factorial() {
            playClickSound(750);
            try {
                let n = parseInt(evaluatedResult !== '0' ? evaluatedResult : currentExpression);
                if (isNaN(n) || n < 0) {
                    evaluatedResult = 'ত্রুটি';
                } else if (n > 170) {
                    evaluatedResult = 'অসীম (∞)';
                } else {
                    let fact = 1;
                    for (let i = 2; i <= n; i++) fact *= i;
                    currentExpression = `${n}!`;
                    evaluatedResult = fact.toString();
                    saveToHistory(`${n}!`, evaluatedResult);
                }
            } catch (e) {
                evaluatedResult = 'ত্রুটি';
            }
            updateDisplay();
        }

        function saveToHistory(expr, ans) {
            if (!expr || ans === 'ত্রুটি') return;
            const item = {
                id: Date.now(),
                expression: expr,
                result: ans,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            calculationHistory.unshift(item);
            if (calculationHistory.length > 30) calculationHistory.pop();
            renderHistory();

            // Flash badge briefly
            const badge = document.getElementById('historyBadge');
            badge.classList.remove('hidden');
            setTimeout(() => badge.classList.add('hidden'), 2000);
        }

        function renderHistory() {
            const list = document.getElementById('historyListContainer');
            const emptyMsg = document.getElementById('emptyHistoryMsg');

            if (calculationHistory.length === 0) {
                list.innerHTML = '';
                list.appendChild(emptyMsg);
                return;
            }

            list.innerHTML = '';
            calculationHistory.forEach(item => {
                const card = document.createElement('div');
                card.className = 'glass-btn p-3 rounded-2xl flex flex-col justify-between cursor-pointer hover:border-purple-500/40 transition group';
                card.onclick = () => restoreHistoryItem(item.result);

                card.innerHTML = `
                    <div class="flex justify-between items-center text-[10px] text-slate-400 pb-1">
                        <span>${item.time}</span>
                        <span class="text-purple-400 group-hover:underline">ব্যবহার করুন</span>
                    </div>
                    <div class="font-mono-math text-xs text-slate-300 truncate">${item.expression}</div>
                    <div class="font-mono-math text-base font-bold text-emerald-400 text-right mt-1">= ${item.result}</div>
                `;
                list.appendChild(card);
            });
        }

        function restoreHistoryItem(val) {
            currentExpression = val;
            evaluatedResult = val;
            updateDisplay();
            toggleHistoryDrawer();
            showToast('হিসাব লোড করা হয়েছে');
        }

        function clearHistoryList() {
            calculationHistory = [];
            renderHistory();
            showToast('হিস্ট্রি মুছে ফেলা হয়েছে');
        }

        function toggleHistoryDrawer() {
            playClickSound(650);
            const drawer = document.getElementById('historyDrawer');
            drawer.classList.toggle('translate-y-full');
        }

        function toggleScientificPad() {
            playClickSound(500);
            isSciPadOpen = !isSciPadOpen;
            const sciGrid = document.getElementById('scientificGrid');
            const chevron = document.getElementById('sciChevron');

            if (isSciPadOpen) {
                sciGrid.classList.remove('hidden');
                chevron.classList.add('rotate-180');
            } else {
                sciGrid.classList.add('hidden');
                chevron.classList.remove('rotate-180');
            }
        }

        function toggleAngleMode() {
            playClickSound(750);
            isAngleDegree = !isAngleDegree;
            const badge = document.getElementById('angleModeBadge');
            badge.textContent = isAngleDegree ? 'DEG' : 'RAD';
            showToast(isAngleDegree ? 'ডিগ্রি মোড (DEG)' : 'রেডিয়ান মোড (RAD)');
        }

        function cycleTheme() {
            playClickSound(800);
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            const t = themes[currentThemeIndex];

            // Update glow backgrounds
            const g1 = document.getElementById('glowCircle1');
            const g2 = document.getElementById('glowCircle2');
            const eq = document.getElementById('equalBtn');

            // Reset classes
            g1.className = `absolute -top-24 -left-24 w-96 h-96 rounded-full blur-3xl animate-glow-1 ${t.glow1}`;
            g2.className = `absolute -bottom-28 -right-24 w-96 h-96 rounded-full blur-3xl animate-glow-2 ${t.glow2}`;
            eq.className = `btn-ripple h-14 rounded-2xl flex items-center justify-center text-2xl font-bold text-white shadow-xl hover:brightness-110 active:scale-95 transition ${t.btnEqual}`;

            showToast(`থিম: ${t.name}`);
        }

        function showToast(msg) {
            const toast = document.getElementById('toastMessage');
            const txt = document.getElementById('toastText');
            txt.textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }

        function copyToClipboard() {
            const val = document.getElementById('mainResultDisplay').value;
            const temp = document.createElement('textarea');
            temp.value = val;
            document.body.appendChild(temp);
            temp.select();
            try {
                document.execCommand('copy');
                showToast('ফলাফল কপি হয়েছে: ' + val);
            } catch (err) {
                showToast('কপি ব্যর্থ হয়েছে');
            }
            document.body.removeChild(temp);
        }

        /* Sync Real Phone Time, Battery Charge & Connectivity */
        function initRealDeviceStatusBar() {
            // 1. Live Phone Clock (12-hour format with real minutes)
            function updateClock() {
                const now = new Date();
                let hours = now.getHours();
                let minutes = now.getMinutes();
                const displayHours = hours % 12 || 12;
                const formattedMinutes = minutes < 10 ? '0' + minutes : minutes;
                const clockEl = document.getElementById('statusBarTime');
                if (clockEl) {
                    clockEl.textContent = `${displayHours}:${formattedMinutes}`;
                }
            }
            setInterval(updateClock, 1000);
            updateClock();

            // 2. Real Hardware Battery API (Supported natively on Android WebViews & Chrome)
            if ('getBattery' in navigator) {
                navigator.getBattery().then((battery) => {
                    function updateBatteryStatus() {
                        const levelPercent = Math.round(battery.level * 100);
                        const isCharging = battery.charging;

                        const levelEl = document.getElementById('statusBarBatteryLevel');
                        const iconEl = document.getElementById('statusBarBatteryIcon');
                        const dotEl = document.getElementById('deviceStateDot');

                        if (levelEl) {
                            levelEl.textContent = `${levelPercent}%`;
                        }

                        if (iconEl) {
                            if (isCharging) {
                                // Charger connected: Show lightning bolt animation
                                iconEl.className = 'fa-solid fa-bolt text-amber-300 text-xs animate-pulse';
                                if (dotEl) dotEl.className = 'w-2 h-2 rounded-full bg-amber-400 mr-1.5 animate-ping';
                            } else {
                                if (dotEl) dotEl.className = 'w-2 h-2 rounded-full bg-emerald-500/80 mr-1.5 animate-pulse';
                                // Normal battery level states
                                if (levelPercent > 85) {
                                    iconEl.className = 'fa-solid fa-battery-full text-emerald-400 text-xs';
                                } else if (levelPercent > 60) {
                                    iconEl.className = 'fa-solid fa-battery-three-quarters text-emerald-400 text-xs';
                                } else if (levelPercent > 35) {
                                    iconEl.className = 'fa-solid fa-battery-half text-cyan-400 text-xs';
                                } else if (levelPercent > 15) {
                                    iconEl.className = 'fa-solid fa-battery-quarter text-amber-400 text-xs';
                                } else {
                                    iconEl.className = 'fa-solid fa-battery-empty text-rose-500 text-xs animate-pulse';
                                }
                            }
                        }
                    }

                    // Initial sync and live event listeners for real charge change
                    updateBatteryStatus();
                    battery.addEventListener('levelchange', updateBatteryStatus);
                    battery.addEventListener('chargingchange', updateBatteryStatus);
                }).catch(() => {
                    // Fallback for browsers with strict battery permissions
                    const levelEl = document.getElementById('statusBarBatteryLevel');
                    if (levelEl) levelEl.textContent = '100%';
                });
            } else {
                // Default fallback if Battery API is unavailable
                const levelEl = document.getElementById('statusBarBatteryLevel');
                if (levelEl) levelEl.textContent = '100%';
            }

            // 3. Real Internet Connectivity Listener (WiFi vs Offline)
            function updateNetworkStatus() {
                const wifiIcon = document.getElementById('statusBarWifiIcon');
                const signalIcon = document.getElementById('statusBarSignalIcon');
                if (wifiIcon) {
                    if (navigator.onLine) {
                        wifiIcon.className = 'fa-solid fa-wifi text-[10px] text-cyan-400';
                        if (signalIcon) signalIcon.className = 'fa-solid fa-signal text-[10px] text-slate-300';
                    } else {
                        wifiIcon.className = 'fa-solid fa-plane text-[10px] text-rose-400';
                        if (signalIcon) signalIcon.className = 'fa-solid fa-signal text-[10px] text-slate-600';
                    }
                }
            }
            window.addEventListener('online', updateNetworkStatus);
            window.addEventListener('offline', updateNetworkStatus);
            updateNetworkStatus();
        }

        // Initialize device sensors and status bar on start
        initRealDeviceStatusBar();

        // Keyboard hotkeys support
        window.addEventListener('keydown', (e) => {
            if ((e.key >= '0' && e.key <= '9') || e.key === '.') {
                pressKey(e.key);
            } else if (['+', '-', '*', '/'].includes(e.key)) {
                pressOperator(e.key);
            } else if (e.key === 'Enter' || e.key === '=') {
                e.preventDefault();
                calculateResult();
            } else if (e.key === 'Backspace') {
                backspace();
            } else if (e.key === 'Escape') {
                clearAll();
            } else if (e.key === '(' || e.key === ')') {
                pressKey(e.key);
            } else if (e.key === '%') {
                pressKey('%');
            }
        });
    </script>
</body>
</html>
